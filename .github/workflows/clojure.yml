name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install server dependencies
      working-directory: Android-WebRTC-Spyware-Server
      run: npm ci
    - name: Check JavaScript syntax
      working-directory: Android-WebRTC-Spyware-Server
      run: |
        node --check server.js
        node --check public/client.js
        node --check debug_webrtc.js
