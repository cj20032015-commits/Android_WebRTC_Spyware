name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
        cache: gradle
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Run unit tests and assemble debug APK
      run: bash ./gradlew testDebugUnitTest assembleDebug -x processDebugGoogleServices
